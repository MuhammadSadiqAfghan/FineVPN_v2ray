# Use Docker for builds so the deployment does not depend on Railpack/Mise
# Python installation. Keep secrets in Hostless Environment Variables, not here.
build:
  system: docker

dockerfile_path: "./Dockerfile"
working_directory: "/"
build_context_directory: "/"
start_command: "uvicorn main:app --host 0.0.0.0 --port $PORT"

health_check:
  type: http
  http_path: "/health"
  interval_in_seconds: 30
